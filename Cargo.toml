[package]
name = "magnetite-mobile-core"
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"
rust-version = "1.88"
publish = false
repository = "https://github.com/magnetite-browser/magnetite-mobile-core"
description = "What Magnetite's phone apps share: joining a sync chain, reading and changing its sidebar and archive, history, content blocking"

[lib]
name = "magnetite_mobile_core"
# staticlib: iOS. cdylib: Android, and the bindings generator reads it.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# The bindings generator; only built on the development machine.
bindgen = ["uniffi/cli"]

[dependencies]
# The head of magnetite#414 (the sidebar merges, unknown fields are kept, the
# archive syncs), until a release has it: then its tag.
magnetite-core = { git = "https://github.com/magnetite-browser/magnetite", rev = "63ec43669497a786674d5369e1f53d8a14833570" }
magnetite-sync-proto = { git = "https://github.com/magnetite-browser/magnetite-sync", tag = "v0.1.0" }
uniffi = "0.32"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.4"
# The desktop's filter engine; on iOS only its conversion to WebKit's content rules.
adblock = { version = "0.13", default-features = false, features = ["content-blocking", "embedded-domain-resolver", "full-regex-handling"] }

# A workspace of its own: the crate also builds in a checkout that lies inside
# another workspace's folder (the desktop's).
[workspace]

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
